[project]
name = "voice-erp-backend"
version = "0.1.0"
description = "ERP API of the Voice ERP hackathon kit (FastAPI + SQLite)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[tool.uv]
package = false
