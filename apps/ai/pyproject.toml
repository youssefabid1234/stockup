[project]
name = "ai"
version = "0.1.0"
description = "Voice ERP kit — AI service (LLM · STT · TTS · agent harness)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "websockets>=14",
    "lameenc>=1.7",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]  # import `app` from the tests

[tool.uv]
package = false

[tool.ruff]
line-length = 140

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports
